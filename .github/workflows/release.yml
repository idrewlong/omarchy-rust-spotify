# Builds the binaries for each tagged version (v0.1.0, ...) on x86_64 and
# aarch64 Linux, attests where they were built (`gh attestation verify`),
# and attaches them to the GitHub release with SHA256SUMS.
# scripts/install.sh downloads the tarball matching manifest.json's version,
# so the tag must equal it (checked below), and only once its hash is pinned
# in packaging/release.sha256 (scripts/pin-release.sh).
#
# Every action is pinned to a commit and the Rust toolchain to a version,
# and there's no build cache: what builds a release is what's reviewed here.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag matches manifest.json
        run: |
          want="v$(jq -r .version manifest.json)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but manifest.json says $want"; exit 1; }
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          tar -C target/release -czf "dist/skinamp-$v-${{ matrix.arch }}-linux.tar.gz" \
            skinampd skinamp skinamp-viz
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
