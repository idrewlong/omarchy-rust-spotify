<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23233a"/><stop offset="1" stop-color="#0e0e16"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a246a"/><stop offset="1" stop-color="#a6caf0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <!-- back: Windows Media Player 2000 -->
  <g transform="rotate(-10 128 128)" filter="url(#sh)">
    <rect x="46" y="44" width="150" height="110" rx="6" fill="#d4d0c8"/>
    <rect x="50" y="48" width="142" height="14" rx="2" fill="url(#title)"/>
    <rect x="56" y="70" width="36" height="76" fill="#3a5fa8"/>
    <rect x="98" y="70" width="88" height="60" fill="#000"/>
    <rect x="98" y="136" width="88" height="6" rx="3" fill="#0a246a"/>
  </g>
  <!-- middle: a visualizer window -->
  <g transform="rotate(6 128 128)" filter="url(#sh)">
    <rect x="64" y="84" width="150" height="96" rx="6" fill="#000"/>
    <circle cx="139" cy="132" r="38" fill="none" stroke="#1060ff" stroke-width="7" stroke-opacity="0.8"/>
    <circle cx="139" cy="132" r="26" fill="none" stroke="#40ffe8" stroke-width="6"/>
    <circle cx="139" cy="132" r="14" fill="none" stroke="#e03ce0" stroke-width="5"/>
    <circle cx="139" cy="132" r="4" fill="#ffd24a"/>
  </g>
  <!-- front: the round play button -->
  <circle cx="176" cy="178" r="46" fill="#1ed760" filter="url(#sh)"/>
  <g fill="#0b0b10"><rect x="154" y="170" width="9" height="24" rx="3"/><rect x="167" y="156" width="9" height="38" rx="3"/><rect x="180" y="164" width="9" height="30" rx="3"/><rect x="193" y="176" width="9" height="18" rx="3"/></g>
</svg>
