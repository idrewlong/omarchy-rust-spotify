<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23233a"/><stop offset="1" stop-color="#0e0e16"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a246a"/><stop offset="1" stop-color="#a6caf0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <!-- back: Windows Media Player 2000 -->
  <g transform="rotate(-10 128 128)" filter="url(#sh)">
    <rect x="46" y="44" width="150" height="110" rx="6" fill="#d4d0c8"/>
    <rect x="50" y="48" width="142" height="14" rx="2" fill="url(#title)"/>
    <rect x="56" y="70" width="36" height="76" fill="#3a5fa8"/>
    <rect x="98" y="70" width="88" height="60" fill="#000"/>
    <rect x="98" y="136" width="88" height="6" rx="3" fill="#0a246a"/>
  </g>
  <!-- middle: Winamp -->
  <g transform="rotate(6 128 128)" filter="url(#sh)">
    <rect x="64" y="84" width="150" height="96" rx="6" fill="#3b3b52"/>
    <rect x="72" y="96" width="56" height="34" fill="#000"/>
    <g fill="#00e000"><rect x="78" y="104" width="6" height="18"/><rect x="88" y="104" width="12" height="4"/><rect x="88" y="118" width="12" height="4"/><rect x="104" y="104" width="4" height="18"/><rect x="112" y="104" width="12" height="4"/><rect x="112" y="118" width="12" height="4"/></g>
    <g fill="#00c000"><rect x="136" y="116" width="8" height="14"/><rect x="148" y="104" width="8" height="26"/><rect x="160" y="110" width="8" height="20"/><rect x="172" y="100" width="8" height="30"/><rect x="184" y="112" width="8" height="18"/><rect x="196" y="120" width="8" height="10"/></g>
    <rect x="72" y="140" width="134" height="6" rx="2" fill="#16162a"/>
    <rect x="72" y="140" width="70" height="6" rx="2" fill="#e8a500"/>
    <g fill="#b0b0c4"><rect x="72" y="154" width="22" height="14" rx="2"/><rect x="98" y="154" width="22" height="14" rx="2"/><rect x="124" y="154" width="22" height="14" rx="2"/></g>
  </g>
  <!-- front: the round play button -->
  <circle cx="176" cy="178" r="46" fill="#1ed760" filter="url(#sh)"/>
  <path d="M164 156 L200 178 L164 200 Z" fill="#0b0b10"/>
