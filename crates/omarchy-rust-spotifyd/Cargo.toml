[package]
name = "omarchy-rust-spotifyd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omarchy-rust-spotify-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-connect = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
mpris-server = "0.10.0"
http = "1.3"
bytes = "1"
libc = "0.2"
libpulse-binding = { version = "2", default-features = false }
libpulse-simple-binding = { version = "2", default-features = false }
sha2 = "0.11.0"
base64 = "0.22"
rand = "0.9"
form_urlencoded = "1.2"
toml = "1.1.6"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
futures-util = "0.3.34"
realfft = "3.5.0"
librespot-protocol = "0.8.0"
protobuf = "3.7.2"
