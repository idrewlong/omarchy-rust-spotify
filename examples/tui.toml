# ~/.config/omarchy-rust-spotify/tui.toml
# Everything is optional. Colors you leave out follow the active Omarchy
# theme (and change with it). Edits apply as soon as you save.

[colors]
# accent = "#e06c75"      # title, artist, progress fill
# foreground = "#d4d5d9"
# background = "#0a0f1c"
# muted = "#51545e"       # album, times, help, empty progress

[layout]
# skin = "classic"        # classic | compact | wmp2000   (press t to cycle)
#                         # wmp2000 keeps its Windows 2000 palette; [colors]
#                         # apply to classic and compact
# cover = "left"          # left | top | none  (left falls back to top when narrow)
# cover-size = 0          # rows; 0 = as big as fits
# align = "center"        # center | left
# frame = "rounded"       # rounded | plain | double | thick | none
# progress = "line"       # line ━━━─── | block ███░░░ | dots ▰▰▰▱▱▱
# show-album = true
# show-status = true
# show-help = true
# title = " omarchy-rust-spotify "
