# ~/.config/omarchy-rust-spotify/tui.toml
# Everything is optional. Colors you leave out follow the active Omarchy
# theme (and change with it). Edits apply as soon as you save.

[colors]
# accent = "#e06c75"      # title, artist, progress fill
# foreground = "#d4d5d9"
# background = "#0a0f1c"
# muted = "#51545e"       # album, times, help, empty progress

[layout]
# playlist-order = "recent" # recent (like Spotify's Recents) | library | name
# skin = "library"        # press t to cycle:
#   library   find and play music (default), in your Omarchy theme
#   classic   big now-playing, in your Omarchy theme
#   lyrics    the words of what's playing, following the song (LRCLIB)
#   spotify   today's Spotify desktop app: Your Library, green play button
#   wmp2000   Windows 2000 era Media Player
#   winamp    Winamp 2.x base skin: green LCD, playlist editor
#   itunes    iTunes 4, 2003 brushed metal, striped song list
#   ipod      2004 iPod with a clickable click wheel and menus
#   zune      Zune software 2006: black, lowercase, magenta/orange
#   wmp11     Windows Media Player 11 (Vista): glossy black Aero
#   visualizer  full-screen visualizations of the real audio (v: next style)
# viz = "bars"            # the visualizer's style, after WMP's visualizations:
#   bars            spectrum bars with falling peak caps
#   mirror          spectrum mirrored about the middle
#   scope           the waveform as a glowing line (Bars and Waves)
#   fire-storm      the spectrum burning upward (Bars and Waves: Fire Storm)
#   musical-colors  rings of colour, bass in the middle
#   alchemy         a morphing plasma that changes scene every few bars
#   battery         a zooming, spinning, mirrored feedback tunnel
#   (t steps through each of these as its own skin, then the GPU presets:
#   battery, alchemy, spectrum, ambience, warp and your own, in full
#   resolution where the terminal shows Sixel images. Start on one with
#   tui --viz gpu:NAME.)
# [colors] apply to library and classic; the period skins keep their own.
# cover = "left"          # left | top | none  (left falls back to top when narrow)
# cover-size = 0          # rows; 0 = as big as fits
# align = "center"        # center | left
# frame = "rounded"       # rounded | plain | double | thick | none
# progress = "line"       # line ━━━─── | block ███░░░ | dots ▰▰▰▱▱▱
# show-album = true
# show-status = true
# show-help = true
# title = " omarchy-rust-spotify "
